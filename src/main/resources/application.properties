# ==========================================================
# APLICACIÓN
# ==========================================================
spring.application.name=ReservasAulas
server.port=8080

# ==========================================================
# BASE DE DATOS SQL (por defecto: H2 guardada en un ARCHIVO)
# - No requiere instalar nada: la aplicación arranca en cualquier computador.
# - Los datos SE CONSERVAN entre ejecuciones (carpeta ./data del proyecto).
# - Para usar MySQL en lugar de H2:  perfil "mysql"  (ver application-mysql.properties y el README).
# - También se puede cambiar con las variables de entorno DB_URL, DB_USERNAME y DB_PASSWORD.
# ==========================================================
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/reservas_aulas}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# ==========================================================
# JPA / HIBERNATE
# update: crea o completa las tablas al arrancar (database/schema.sql es el equivalente manual)
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
# false: no imprime cada consulta SQL en la consola (ruido y posible exposición de datos). Para depurar: true
spring.jpa.show-sql=false
# false: la sesión de base de datos se cierra al terminar el servicio, no al terminar la página.
# Las relaciones del proyecto son EAGER, así que las vistas no necesitan carga perezosa.
spring.jpa.open-in-view=false

# La consola web de H2 (/h2-console) permite ejecutar SQL: se mantiene desactivada (DevTools la activaría).
spring.h2.console.enabled=false

# ==========================================================
# SESIÓN Y COOKIES
# La sesión (HttpSession) vive en el servidor; el navegador solo guarda la cookie JSESSIONID con su identificador.
# ==========================================================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# El identificador de sesión viaja solo en la cookie (nunca en la URL).
server.servlet.session.tracking-modes=cookie
# true cuando la aplicación se publique con HTTPS (variable de entorno COOKIE_SECURE=true).
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ==========================================================
# PÁGINAS DE ERROR (templates/error/404.html, 500.html y templates/error.html)
# Nunca se muestran mensajes internos ni trazas de error al usuario.
# ==========================================================
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ==========================================================
# LOGGING
# Para ver el tiempo de ejecución de cada servicio (LogAspect), quite el # de la línea siguiente:
# ==========================================================
# logging.level.Sistema.Reservas.Aulas.Aspect.LogAspect=DEBUG

# ==========================================================
# API REST (/api/aulas, /api/cursos, /api/usuarios, /api/reservas y /api/v1/reactive)
# true  = se prueba en Postman sin cuenta ni contraseña, pero SOLO desde este mismo equipo (localhost).
#         Desde otra máquina de la red exige HTTP Basic. (por defecto)
# false = toda la API exige HTTP Basic (correo y contraseña de una cuenta creada en /registro).
#         Úselo siempre que la aplicación quede accesible desde otros equipos o detrás de un proxy.
# ==========================================================
api.publica=true

# ==========================================================
# DATOS PREDETERMINADOS Y DEMOSTRACIÓN REACTIVA
# app.datos-iniciales:      true = al primer arranque carga aulas, cursos, usuarios y reservas de ejemplo
#                           (solo llena las tablas que estén vacías)
# app.demo-reactiva-consola: true = imprime la demostración reactiva en la consola al iniciar
# La demostración en el navegador está siempre disponible en http://localhost:8080/reactivo
# ==========================================================
app.datos-iniciales=true
app.demo-reactiva-consola=true

# ==========================================================
# MÓDULO WEBFLUX (/api/v1/reactive)
# webflux.fuente.url:        URL base que consulta el WebClient (por defecto, esta misma aplicación:
#                            /api/aulas real y las rutas simuladas /api/v1/reactive/simulado/**)
# webflux.fuente.timeout-ms: tiempo máximo de espera de la respuesta
# ==========================================================
webflux.fuente.url=http://localhost:${server.port:8080}
webflux.fuente.timeout-ms=2000
