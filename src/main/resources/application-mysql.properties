# Perfil "mysql": usa MySQL en lugar de H2.
# Requisito: MySQL encendido en el puerto 3306 (por ejemplo desde XAMPP).
# Uso en IntelliJ: Run > Edit Configurations > Active profiles = mysql
# Uso por consola: ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# createDatabaseIfNotExist=true crea la base "reservas_aulas" si no existe.
# sslMode=PREFERRED cifra la conexión cuando el servidor lo permite (y sigue funcionando si no).
# Si MySQL 8 responde "Public Key Retrieval is not allowed", agregue &allowPublicKeyRetrieval=true
# SOLO cuando MySQL esté en este mismo equipo.
# Seguridad: el usuario "root" sin contraseña es solo para pruebas locales. Cree una contraseña y páselas por
# variables de entorno (DB_USERNAME y DB_PASSWORD) en lugar de escribirlas en este archivo.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/reservas_aulas?createDatabaseIfNotExist=true&sslMode=PREFERRED&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
